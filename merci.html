  <style>
    :root {
      --magenta: #e0007a;
      --magenta-light: #ff3fa0;
      --lime: #7fff00;
      --lime-dark: #5cd400;
      --gray-bg: #f0f0f0;
      --gray-dark: #2a2a2a;
      --gray-mid: #555;
      --white: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--gray-bg);
      color: var(--gray-dark);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(240,240,240,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--magenta);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 64px;
    }

    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 2px;
      color: var(--gray-dark);
      text-decoration: none;
    }
    .nav-logo span { color: var(--magenta); }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }
    .nav-links a {
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--gray-dark);
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--magenta); }
    .nav-cta {
      background: var(--magenta);
      color: var(--white) !important;
      padding: 0.4rem 1rem;
      border-radius: 4px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem 3rem;
    }

    .merci-card {
      background: var(--white);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 3rem 2.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .merci-icon {
      width: 64px;
      height: 64px;
      background: var(--lime);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }

    .merci-icon svg {
      width: 32px;
      height: 32px;
    }

    .merci-card h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: var(--gray-dark);
      margin-bottom: 1rem;
    }

    .merci-card p {
      font-size: 1.05rem;
      color: var(--gray-mid);
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .btn-retour {
      display: inline-block;
      background: var(--magenta);
      color: var(--white);
      text-decoration: none;
      padding: 0.75rem 1.8rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.3s;
    }
    .btn-retour:hover { background: var(--magenta-light); }

    footer {
      background: var(--gray-dark);
      color: rgba(255,255,255,0.7);
      font-size: 0.82rem;
      text-align: center;
      padding: 1.2rem;
    }
    footer a { color: var(--lime); text-decoration: none; }

    @media (max-width: 600px) {
      .nav-links { display: none; }
      .merci-card { padding: 2rem 1.5rem; }
    }
  </style>
</head>

          <polyline points="20 6 9 17 4 12"/>

      </div>
      <h1>Message envoyé !</h1>
      <p>Merci pour votre message, nous nous efforçons de vous répondre dans les meilleurs délais.</p>
      <a href="index.html" class="btn-retour">Retour à l'accueil</a>
    </div>
  </main>

  <footer>
