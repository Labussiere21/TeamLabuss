{% extends 'layout.html' %}
{% block content %}
<h1>Formations — Contenu des pages</h1>
<p style="color:#666; font-size:0.9rem; margin-bottom:1.5rem;">
  Sélectionnez une page pour modifier son contenu.
</p>
<div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap:1rem;">
  {% for fn, lb in pages %}
  <a href="/formations/{{ fn }}"
     style="display:block; background:white; border:2px solid #eee; border-radius:10px;
            padding:1.5rem; text-decoration:none; color:#222; text-align:center;
            transition:border-color 0.15s, transform 0.15s;">
    <div style="font-size:2rem; margin-bottom:0.5rem;">📝</div>
    <div style="font-weight:600;">{{ lb }}</div>
    <div style="font-size:0.8rem; color:#aaa; margin-top:0.3rem;">{{ fn }}</div>
  </a>
  {% endfor %}
</div>
{% endblock %}
