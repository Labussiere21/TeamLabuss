<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Back Office — Auto-École Labussière</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f2f2f2; color: #222; }

    nav {
      background: #e0007a;
      display: flex;
      align-items: center;
      padding: 0 2rem;
      height: 58px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .nav-brand { color: white; font-weight: 700; font-size: 1rem; margin-right: 2rem; white-space: nowrap; }
    nav a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      padding: 0 1.1rem;
      height: 58px;
      display: flex;
      align-items: center;
      font-size: 0.92rem;
      transition: background 0.15s;
    }
    nav a:hover { background: rgba(0,0,0,0.15); color: white; }
    nav a.active { background: rgba(0,0,0,0.25); color: white; font-weight: 600; }
    .nav-right { margin-left: auto; }
    .btn-publier {
      background: #7fff00;
      color: #111;
      border: none;
      padding: 0.45rem 1.4rem;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s;
    }
    .btn-publier:hover { background: #5cd400; }

    main { max-width: 980px; margin: 2rem auto; padding: 0 1.2rem 3rem; }

    .alert { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.2rem; font-size: 0.92rem; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #b8dfc6; }
    .alert-error   { background: #f8d7da; color: #721c24; border: 1px solid #f1b0b7; }
    .alert-info    { background: #d1ecf1; color: #0c5460; border: 1px solid #a9d9e2; }

    h1 { font-size: 1.5rem; color: #e0007a; margin-bottom: 1.5rem; }

    .card {
      background: white;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.09);
    }
    .card h2 { font-size: 1rem; color: #444; margin-bottom: 1.2rem; font-weight: 600; }

    label { display: block; font-size: 0.82rem; font-weight: 600; color: #555; margin-bottom: 0.25rem; }
    input[type=text], textarea {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 0.93rem;
      margin-bottom: 1rem;
      font-family: inherit;
    }
    input[type=text]:focus, textarea:focus { outline: none; border-color: #e0007a; }
    textarea { resize: vertical; min-height: 80px; }

    .btn-primary {
      background: #e0007a;
      color: white;
      border: none;
      padding: 0.5rem 1.4rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .btn-primary:hover { background: #c0006a; }
    .btn-danger {
      background: white;
      color: #c0392b;
      border: 1px solid #c0392b;
      padding: 0.3rem 0.8rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-danger:hover { background: #c0392b; color: white; }
  </style>
</head>
<body>
  <nav>
    <span class="nav-brand">Auto-École Labussière — Admin</span>
    <a href="/actualites" {% if active == 'actualites' %}class="active"{% endif %}>Actualités</a>
    <a href="/tarifs"     {% if active == 'tarifs'     %}class="active"{% endif %}>Tarifs</a>
    <a href="/documents"  {% if active == 'documents'  %}class="active"{% endif %}>Documents PDF</a>
    <div class="nav-right">
      <form action="/publier" method="post">
        <button type="submit" class="btn-publier">↑ Publier sur le site</button>
      </form>
    </div>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
